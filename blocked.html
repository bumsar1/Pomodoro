<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eee;
    }

    .card { text-align: center; max-width: 440px; padding: 52px 44px; }

    .tomato {
      font-size: 72px; margin-bottom: 28px; display: block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.06); }
    }

    h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #e74c3c; }

    .current-task {
      display: none;
      margin-bottom: 16px;
      padding: 5px 14px;
      background: #252540;
      border-radius: 20px;
      font-size: 13px;
      color: #8080c0;
      border: 1px solid #3a3a6a;
    }

    .subtitle { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 32px; }

    .timer {
      font-size: 54px;
      font-weight: 800;
      color: #e74c3c;
      letter-spacing: 4px;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      transition: color 0.4s;
      min-height: 66px;
    }
    .timer.ending { color: #f39c12; }

    .timer-label {
      font-size: 11px; color: #3a3a5a;
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px;
    }

    .btn-back {
      display: inline-block;
      padding: 11px 24px;
      background: #252540;
      color: #777;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #333;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-back:hover { background: #303055; }

    .quote {
      margin-top: 32px;
      font-size: 14px;
      color: #8080b0;
      font-style: italic;
      line-height: 1.6;
    }
    .quote .attr {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      font-style: normal;
      color: #505080;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="tomato">🍅</span>
    <h1>Stay focused.</h1>
    <div class="current-task" id="currentTask"></div>
    <p class="subtitle">This site is blocked during your focus session.<br>You've got this — the break is coming.</p>
    <div class="timer" id="timer"></div>
    <div class="timer-label" id="timerLabel">remaining in session</div>
    <a class="btn-back" id="backBtn">← Go back</a>
    <div class="quote" id="quote"></div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
